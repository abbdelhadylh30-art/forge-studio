  title: G-SHOCK GA-B2100 NOIR — Tough. Solar. Connected.
  description: >-
    Launch-week pre-order for the GA-B2100 NOIR: carbon-cased, shock-resistant to 10 m,
    water-resistant to 200 m, solar-powered and Bluetooth-synced. The last watch you'll
    baby-proof your life for — in reverse.
