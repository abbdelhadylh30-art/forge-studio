    badge: 'NEW · GA-B2100 NOIR'
    headline: Built to outlast everything.
    sub: >-
      A carbon-cored G-SHOCK that shrugs off 10-metre drops, dives to 200 metres, charges
      itself in daylight and sets itself to the exact second. Battery swaps: never again.
    cta:
      label: 'Pre-order — $99'
      href: '#offer'
    secondaryCta:
      label: See it in the wild
      href: '#gallery'
