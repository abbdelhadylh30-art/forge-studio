    carouselInterval: 4
    stats:
      - value: 200M
        label: water resistance
      - value: 10m
        label: drop-tested
      - value: '0'
        label: battery swaps — ever

  - id: gshock-logos
    type: logos
    title: Worn by the relentless
    items:
      - Hypebeast
      - GQ
      - Highsnobiety
      - Complex
      - WatchTime
      - Outside

  - id: gshock-problem
    type: problem
    title: Ordinary watches tap out.
    subtitle: Three ways a "nice" watch ruins your week.
    style: grid
    items:
      - icon: alert
        title: Cracked by door frames
        body: >-
          One careless swing and your sapphire costs more than a weekend away. Fragile watches
          train you to flinch.
      - icon: plug
        title: Dead at the worst moment
        body: >-
          Battery anxiety is real: the quartz dies mid-trip, mid-shift, mid-everything, and the
          jeweller charges you for the privilege.
      - icon: cloud
        title: One splash, done
        body: >-
          "Water resistant 30 m" is a drizzle rating. Rain, a pool, a kayak roll — any of it can
          turn your watch into a paperweight.

  - id: gshock-solution
    type: solution
    title: The Triple-10 doctrine.
    subtitle: 'One rule since 1983: take the hit, keep ticking.'
    style: grid
    items:
      - icon: shield
        title: Carbon Core Guard
        body: >-
          A carbon-reinforced case cradles the movement like a roll cage. Drops that destroy
          phones barely register.
      - icon: sun
        title: Tough Solar
        body: >-
          Any light — daylight, office, lamp — keeps the cell charged. The battery you replace
          never.
      - icon: smartphone
        title: Bluetooth time sync
        body: >-
          Pairs with your phone and pulls the exact time, up to four times a day. Your watch is
          now the most accurate clock you own.

  - id: gshock-stats
    type: stats
    title: '1981 — 2026: still unbroken.'
    items:
      - value: '200+'
        label: prototypes dropped before one survived
      - value: '1983'
        label: the year the first G-SHOCK shipped
      - value: 200M
        label: water resistance, sealed
      - value: 40+
        label: years of the doctrine, unbroken

  - id: gshock-features
    type: features
    title: Engineered for the worst day of your week.
    subtitle: Every detail earns its place on the case.
    style: grid
    columns: 3
    items:
      - icon: shield
        title: Shock resistance
        body: 10 m free-fall onto concrete, tested. The hollow-case mount absorbs what the world dishes out.
      - icon: sun
        title: Tough Solar
        body: Light in, power out. Six months of runtime from a single sunny afternoon.
      - icon: smartphone
        title: Bluetooth sync
        body: Exact time via the CASIO WATCHES app. Set it once — well, never.
      - icon: gauge
        title: 200M water resistance
        body: Swim, snorkel, wash dishes in it. 20-bar seals keep the ocean where it belongs.
      - icon: lightbulb
        title: Super Illuminator
        body: Auto LED lights the face when you tilt to read it. 3 a.m. drill calls, handled.
      - icon: clock
        title: World time + alarms
        body: 38 time zones, 5 alarms, hourly chime. Land anywhere and already be right.

  - id: gshock-story
    type: about
    anchor: story
    title: The watch that refused to break.
    subtitle: A story that starts with a shattered heirloom.
    style: mission
    body: >-
      In 1981, Casio engineer Kikuo Ibe dropped the pocket watch his father had given him. It
      shattered — and with it, the idea that a watch must be precious to be any good. He set a
      rule instead: build one that survives a 10-metre drop, 10 bar of pressure, and 10 years
      of abuse. Two hundred-odd prototypes later, the first G-SHOCK took the hit and kept
      ticking. The GA-B2100 NOIR is that same doctrine, charged by light and synced to the
      second.
    items:
      - title: '10 m'
        body: Free-fall onto concrete — and keep ticking.
      - title: '10 bar'
        body: Water pressure — swim right through it.
      - title: '10 years'
        body: Of daily punishment, minimum. Solar makes it indefinite.
    founder:
      name: Kikuo Ibe
      role: 'Engineer, father of the G-SHOCK'

