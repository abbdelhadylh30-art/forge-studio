        caption: Ready before you are

  - id: gshock-compare
    type: comparison
    title: 'GA-B2100 NOIR vs. the rest of your drawer.'
    subtitle: What a watch built for punishment does differently.
    usLabel: GA-B2100 NOIR
    themLabel: Ordinary watch
    rows:
      - feature: 10 m drop onto concrete
        us: Keeps ticking
        them: Cracked crystal
      - feature: Water resistance
        us: 200M — dive-rated
        them: 30M — splash-rated
      - feature: Battery
        us: Solar — charges itself
        them: Swapped every 12 months
      - feature: Time accuracy
        us: Auto-synced by Bluetooth
        them: Drifts, reset by hand
      - feature: Night visibility
        us: Auto LED illumination
        them: Squint and guess
    note: Drop tests follow G-SHOCK's Triple-10 development standard.

