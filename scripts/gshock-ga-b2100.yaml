  - id: gshock-testimonials
    type: testimonials
    title: Beaten up. Never beaten.
    subtitle: Field reports from people who break things.
    style: grid
    items:
      - quote: >-
          Six years of job sites, two house builds, one dropped scaffold. The strap is scarred,
          the module has never missed a beat.
        author: Marco Reyes
        role: Site foreman
        initials: MR
        rating: 5
      - quote: >-
          I lowsided at 60 km/h and totalled the bike, my jacket and my phone. The G-SHOCK took
          the same slide and still made it to work on time.
        author: Amelia Hart
        role: Adventure rider
        initials: AH
        rating: 5
      - quote: >-
          Solar means I don't think about it, sync means it's always right, and the case means I
          don't have to. It's the only watch I own.
        author: Jonas Weber
        role: Wildland firefighter
        initials: JW
        rating: 5

  - id: gshock-guarantee
    type: guarantee
    title: The toughness guarantee
    subtitle: Put it through hell. We've got you.
    body: >-
      If your GA-B2100 fails a hit it should have survived — or anything else covered by
      warranty — we repair or replace it without a debate. A watch built on the Triple-10
      doctrine doesn't get to blink, and neither do we.
    style: seals
    items:
      - icon: award
        title: 2-year warranty
        body: International coverage, parts and labour.
      - icon: timer
        title: 100-day trial
        body: Wear it hard. Not tough enough? Full refund.
      - icon: shield
        title: Drop-tested batches
        body: Every batch sampled to the Triple-10 standard.

  - id: gshock-faq
    type: faq
    title: Frequently asked questions
    subtitle: The essentials before you commit.
    style: accordion
    items:
      - q: Does Tough Solar need direct sunlight?
        a: >-
          No. Any light source charges it — daylight is fastest, but office and lamp light keep
          the cell topped up. A full charge runs roughly six months, even in the dark.
      - q: How often does it sync the time?
        a: >-
          Up to four times a day automatically when your phone is nearby, via Bluetooth and the
          free CASIO WATCHES app. It also survives without pairing — it's just less exact.
      - q: Will it fit my wrist?
        a: >-
          The resin band adjusts from about 145 to 215 mm, and spring-bar notches are included
          in the box. No jeweller visit required.
      - q: Can I actually swim with it?
        a: >-
          Yes — 200 m (20 bar) water resistance covers swimming, snorkelling and surface
          watersports. Buttons stay sealed; hot showers and saunas are the only thing we'd skip.
      - q: What if it breaks anyway?
        a: >-
          The 2-year international warranty covers manufacturing failures and the 100-day trial
          covers everything else — send it back for a full refund, no questions.

