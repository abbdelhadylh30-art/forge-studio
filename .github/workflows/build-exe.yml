# Forge Studio — Build Desktop App (.exe)
#
# Triggers: tag push (v*) or manual dispatch.
# Produces: NSIS installer + portable exe, smoke-tested, published to a
# GitHub Release when triggered by a tag.

name: Build Desktop App

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Build Next.js (standalone)
        run: bun run build:standalone
        env:
          DATABASE_URL: "file:/tmp/prod.db"
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Verify standalone output
        run: |
          echo "standalone-server dir:"
          dir standalone-server
          echo "next module:"
          if (Test-Path standalone-server\node_modules\next) { Write-Host "YES - next module found" } else { Write-Host "NO - next module MISSING" }
          echo "server.js exists:"
          if (Test-Path standalone-server\server.js) { Write-Host "YES" } else { Write-Host "NO" }
        shell: pwsh

      - name: Smoke test — standalone server boots and serves HTTP
        shell: pwsh
        run: |
          $env:PORT = "3100"
          $env:HOSTNAME = "127.0.0.1"
          $env:NODE_ENV = "production"
          $env:DATABASE_URL = "file:./prod.db"
          $p = Start-Process -FilePath "node" -ArgumentList "server.js" -WorkingDirectory "standalone-server" -PassThru -RedirectStandardOutput "smoke-out.log" -RedirectStandardError "smoke-err.log"
          $ok = $false
          try {
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 2
              if ($p.HasExited) { break }
              try {
                $r = Invoke-WebRequest -Uri "http://127.0.0.1:3100" -UseBasicParsing -TimeoutSec 3
                if ($r.StatusCode -eq 200 -and $r.Content.Length -gt 500) { $ok = $true; break }
              } catch {}
            }
          } finally {
            if (-not $p.HasExited) { taskkill /PID $p.Id /T /F 2>&1 | Out-Null }
          }
          Write-Host "=== server stdout (last 15 lines) ==="
          Get-Content smoke-out.log -ErrorAction SilentlyContinue | Select-Object -Last 15
          Write-Host "=== server stderr (last 15 lines) ==="
          Get-Content smoke-err.log -ErrorAction SilentlyContinue | Select-Object -Last 15
          if (-not $ok) { throw "SMOKE TEST FAILED — standalone server did not serve HTTP 200 within 60s" }
          Write-Host "SMOKE TEST PASSED — standalone server served the dashboard"

      - name: Smoke test — ephemeral port (PORT=0) patch
        shell: pwsh
        run: |
          # The desktop app launches the server with PORT=0 and reads the
          # OS-assigned port back from the startup banner. Verify the patched
          # server.js actually honors PORT=0 and reports the real port.
          $env:PORT = "0"
          $env:HOSTNAME = "127.0.0.1"
          $env:NODE_ENV = "production"
          $env:DATABASE_URL = "file:./prod.db"
          $p = Start-Process -FilePath "node" -ArgumentList "server.js" -WorkingDirectory "standalone-server" -PassThru -RedirectStandardOutput "eph-out.log" -RedirectStandardError "eph-err.log"
          $ok = $false
          $foundPort = 0
          try {
            for ($i = 0; $i -lt 15; $i++) {
              Start-Sleep -Seconds 2
              if ($p.HasExited) { break }
              $banner = Get-Content eph-out.log -Raw -ErrorAction SilentlyContinue
              if ($banner -match 'http://127\.0\.0\.1:(\d+)') {
                $foundPort = [int]$Matches[1]
                try {
                  $r = Invoke-WebRequest -Uri "http://127.0.0.1:$foundPort" -UseBasicParsing -TimeoutSec 3
                  if ($r.StatusCode -eq 200 -and $r.Content.Length -gt 500) { $ok = $true; break }
                } catch {}
              }
            }
          } finally {
            if (-not $p.HasExited) { taskkill /PID $p.Id /T /F 2>&1 | Out-Null }
          }
          Write-Host "=== ephemeral banner (last 10 lines) ==="
          Get-Content eph-out.log -ErrorAction SilentlyContinue | Select-Object -Last 10
          if ($foundPort -eq 0) { throw "EPHEMERAL PATCH TEST FAILED — server banner never reported a port (PORT=0 not honored?)" }
          if (-not $ok) { throw "EPHEMERAL PATCH TEST FAILED — server on port $foundPort did not serve HTTP 200" }
          Write-Host "EPHEMERAL PATCH TEST PASSED — PORT=0 bound OS-assigned port $foundPort and served the dashboard"

      - name: Compile Electron main process
        run: |
          bunx tsc electron/main.ts electron/preload.ts --outDir electron/dist --module commonjs --target es2022 --esModuleInterop --skipLibCheck --resolveJsonModule --moduleResolution node

      - name: Install electron-builder
        run: bun add -d electron electron-builder

      - name: Build .exe (NSIS installer + portable)
        run: npx electron-builder --win --config electron-builder.json --publish never
        # NOTE: GH_TOKEN is intentionally NOT set on this step — electron-builder
        # auto-publishes a draft release when it sees GH_TOKEN on a tag build.
        # Publishing is handled solely by the 'Publish GitHub Release' step below.

      - name: Smoke test — packaged .exe boots and serves HTTP
        shell: pwsh
        run: |
          $exe = Get-ChildItem "release\*.exe" | Where-Object { $_.Name -match '^ForgeStudio-[0-9]' } | Select-Object -First 1
          if (-not $exe) { throw "Portable exe not found in release\ — listing:"; Get-ChildItem release }
          Write-Host "Testing: $($exe.FullName)"
          # The app defaults to an OS-assigned ephemeral port; pin a fixed
          # port via env (honored by the Electron main process) so this test
          # knows where to look. The ephemeral path is covered by the
          # dedicated PORT=0 patch smoke test above.
          $env:PORT = "3000"
          $p = Start-Process -FilePath $exe.FullName -PassThru
          $ok = $false
          $foundPort = 0
          # The app auto-picks the first free port from 3000 (with fallback),
          # so scan 3000-3010 on 127.0.0.1 (its deterministic bind host).
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
            Start-Sleep -Seconds 2
            if ($p.HasExited) { break }
            foreach ($port in 3000..3010) {
              try {
                $r = Invoke-WebRequest -Uri "http://127.0.0.1:$port" -UseBasicParsing -TimeoutSec 2
                if ($r.StatusCode -eq 200 -and $r.Content.Length -gt 500) { $ok = $true; $foundPort = $port; break }
              } catch {}
            }
          }
          Write-Host "=== listening ports ==="
          netstat -ano | Select-String "LISTENING" | Select-Object -First 20
          Write-Host "=== forge processes ==="
          Get-Process | Where-Object { $_.Name -like "*forge*" -or $_.Name -like "*electron*" } | Format-Table Id,Name -AutoSize
          # Kill the whole tree: node server by port, electron by name
          if ($foundPort -gt 0) {
            $conn = netstat -ano | Select-String ":$foundPort\s.*LISTENING"
            if ($conn -match '(\d+)\s*$') { taskkill /PID $Matches[1] /T /F 2>&1 | Out-Null }
          }
          Get-Process -Name "Forge*" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "SMOKE TEST FAILED — packaged exe did not serve HTTP within 120s (scanned 127.0.0.1:3000-3010)" }
          Write-Host "SMOKE TEST PASSED — packaged exe served the dashboard on port $foundPort"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ForgeStudio-Windows-Setup
          path: release/ForgeStudio-Setup-*.exe
          retention-days: 30

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ForgeStudio-Windows-Portable
          path: release/ForgeStudio-[0-9]*.exe
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/ForgeStudio-Setup-*.exe
            release/ForgeStudio-[0-9]*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mac:
    runs-on: macos-latest
    timeout-minutes: 40
    if: false  # Disabled by default — flip to true to enable Mac builds

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Build Next.js (standalone)
        run: bun run build:standalone
        env:
          DATABASE_URL: "file:/tmp/prod.db"
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Compile Electron main process
        run: |
          bunx tsc electron/main.ts electron/preload.ts --outDir electron/dist --module commonjs --target es2022 --esModuleInterop --skipLibCheck --resolveJsonModule --moduleResolution node

      - name: Install electron-builder
        run: bun add -d electron electron-builder

      - name: Build .dmg
        run: npx electron-builder --mac --config electron-builder.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: ForgeStudio-Mac
          path: release/*.dmg
          retention-days: 30
