# Forge Studio — Build Desktop App (.exe)

# Runs on push to main (manual trigger only for now to save CI minutes)
name: Build Desktop App

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Build Next.js (standalone)
        run: bun run build:standalone
        env:
          DATABASE_URL: "file:/tmp/prod.db"
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Verify standalone output
        run: |
          echo "Standalone dir:"
          dir .next\standalone
          echo "Static dir:"
          dir .next\standalone\.next\static
          echo "Public dir:"
          dir .next\standalone\public
        shell: pwsh

      - name: Compile Electron main process
        run: |
          npx tsc electron/main.ts electron/preload.ts --outDir electron/dist --module commonjs --target es2022 --esModuleInterop --skipLibCheck --resolveJsonModule --moduleResolution node

      - name: Install electron-builder
        run: bun add -d electron electron-builder

      - name: Build .exe
        run: npx electron-builder --win --config electron-builder.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: ForgeStudio-Windows-Setup
          path: release/ForgeStudio-Setup-*.exe
          retention-days: 30

      - name: Upload portable build (optional)
        uses: actions/upload-artifact@v4
        with:
          name: ForgeStudio-Windows-Portable
          path: release/*.exe
          retention-days: 30

  build-mac:
    runs-on: macos-latest
    timeout-minutes: 30
    if: false  # Disabled by default — uncomment to enable Mac builds

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Build Next.js (standalone)
        run: bun run build:standalone
        env:
          DATABASE_URL: "file:/tmp/prod.db"
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Verify standalone output
        run: |
          echo "Standalone dir:"
          dir .next\standalone
          echo "Static dir:"
          dir .next\standalone\.next\static
          echo "Public dir:"
          dir .next\standalone\public
        shell: pwsh

      - name: Compile Electron main process
        run: |
          npx tsc electron/main.ts electron/preload.ts --outDir electron/dist --module commonjs --target es2022 --esModuleInterop --skipLibCheck --resolveJsonModule --moduleResolution node

      - name: Install electron-builder
        run: bun add -d electron electron-builder

      - name: Build .dmg
        run: npx electron-builder --mac --config electron-builder.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: ForgeStudio-Mac
          path: release/*.dmg
          retention-days: 30
